# UNROM (mapper 2): 4 x 16 KB PRG; banks 0-2 switch in at $8000, bank 3 is fixed at $C000.
# 8 KB CHR-RAM. Bank 0: game tiles and room tables. Bank 1: the title and the text screens.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0300, size = $0500, type = rw;
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    BANK0:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK1:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    BANK2:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    FIXED:  start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = BANK0,  type = ro;
    BANK1:    load = BANK1,  type = ro;
    CODE:     load = FIXED,  type = ro;
    RODATA:   load = FIXED,  type = ro;
    VECTORS:  load = FIXED,  type = ro, start = $FFFA;
}
